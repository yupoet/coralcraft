[package]
name = "coralcraft-cli"
description = "CoralCraft CLI: probe, headless rendering/export, and MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
clap = { workspace = true }
coralcraft-cdr = { workspace = true }
coralcraft-color = { workspace = true }
coralcraft-doc = { workspace = true }
coralcraft-engine = { workspace = true }
coralcraft-geom = { workspace = true }
coralcraft-mcp = { workspace = true }
coralcraft-render = { workspace = true }
coralcraft-ui-egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
