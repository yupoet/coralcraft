# Continuous integration: `cargo xtask ci` (fmt, clippy -D warnings, tests, cleanroom,
# no-bundled-fonts, pdf-deps, assets, brands, cursors, layers, wasm) on native Linux, macOS and
# Windows runners. Action pins follow refs/vectorcraft.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xtask-ci:
    name: xtask ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install libcdr-tools differential oracle (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcdr-tools
      - name: cargo xtask ci
        run: cargo xtask ci

  fuzz-smoke:
    name: fuzz targets check & smoke run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - name: Build and run fuzz targets
        env:
          CORALCRAFT_FUZZ_ITERS: ${{ github.event_name == 'schedule' && '50000' || '2000' }}
        run: |
          for bin in probe parse_cdr load_doc import_svg import_dxf; do
            cargo run --manifest-path fuzz/Cargo.toml --release --bin "$bin"
          done

  linux-package-smoke:
    # Build the .deb and install it on an older distribution, so a package that only works on the
    # build host can't pass (docs/ai-memory/04-known-issues.md #10). Re-enabled in V0.3 with the
    # rebranded packaging; the CLI binary keeps its upstream name coralcraft-cli until V0.4.
    name: Linux .deb install smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install nfpm
        run: |
          go_binary="${HOME}/go/bin/nfpm"
          if [ -x "$go_binary" ]; then echo "$go_binary" >> "$GITHUB_PATH"; exit 0; fi
          curl -fsSL https://nfpm.goreleaser.com/gosu-nfpm.sh | sh -s -- -b "$HOME/go/bin"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Build .deb and .tar.gz
        run: bash packaging/linux/package.sh --formats "deb tar"
      - name: Install and run on Debian 11 (glibc 2.31)
        run: |
          docker run --rm -v "$PWD/dist/release":/r:ro debian:11 sh -ec '
            dpkg -i /r/coralcraft-*-linux-x86_64.deb
            coralcraft-cli --version
            coralcraft --version
            printf "%s\n" "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/list\"}" | coralcraft-cli mcp | grep -q "\"tools\""
          '

  test-32bit:
    # usize is 32 bits on wasm32/i686: offset arithmetic that cannot overflow on 64-bit hosts can
    # overflow here (docs/gaps.md R1.4). Run the whole test suite on i686 Linux.
    name: tests (i686, 32-bit usize)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: i686
      - name: Install 32-bit C toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: cargo test (i686)
        run: cargo test --workspace --target i686-unknown-linux-gnu
