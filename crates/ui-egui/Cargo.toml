[package]
name = "coralcraft-ui-egui"
description = "Replaceable egui desktop and Web frontend for CoralCraft"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
coralcraft-cdr = { path = "../cdr" }
coralcraft-color = { path = "../color" }
coralcraft-doc = { path = "../doc" }
coralcraft-engine = { path = "../engine" }
coralcraft-geom = { path = "../geom" }
coralcraft-render = { path = "../render" }
coralcraft-tools = { path = "../tools" }
egui.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
egui_kittest.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
similar_names = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
items_after_statements = "allow"
doc_markdown = "allow"
needless_pass_by_value = "allow"
return_self_not_must_use = "allow"
float_cmp = "allow"
unreadable_literal = "allow"
large_types_passed_by_value = "allow"
