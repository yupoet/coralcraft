[package]
name = "coralcraft-doc"
description = "Multi-page publication document model for CoralCraft"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
coralcraft-geom = { workspace = true }
coralcraft-color = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
