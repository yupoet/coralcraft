[package]
name = "coralcraft-tools"
description = "Interactive tool and panel state machines: Pick, Shape, Pen, Text"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
coralcraft-color = { path = "../color" }
coralcraft-doc = { path = "../doc" }
coralcraft-geom = { path = "../geom" }
serde.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
