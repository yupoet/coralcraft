[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/coralcraft-cli", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/paris/coralcraft"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

# internal
coralcraft-geom = { path = "crates/geom" }
coralcraft-color = { path = "crates/color" }
coralcraft-doc = { path = "crates/doc" }
coralcraft-cdr = { path = "crates/cdr" }
coralcraft-render = { path = "crates/render" }
coralcraft-tools = { path = "crates/tools" }
coralcraft-engine = { path = "crates/engine" }
coralcraft-ui-egui = { path = "crates/ui-egui" }
coralcraft-mcp = { path = "crates/mcp" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
