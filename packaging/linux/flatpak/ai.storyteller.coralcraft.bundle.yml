# Flatpak manifest for the single-file bundle attached to GitHub Releases
# (coralcraft-<version>-linux-<arch>.flatpak). Build with packaging/linux/flatpak-bundle.sh.
id: ai.storyteller.coralcraft
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: coralcraft
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --filesystem=xdg-pictures
  - --filesystem=~/.fonts:ro
modules:
  - name: coralcraft
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/coralcraft /app/bin/coralcraft
      - install -Dm755 bin/coralcraft-cli /app/bin/coralcraft-cli
      - install -Dm644 share/applications/ai.storyteller.coralcraft.desktop /app/share/applications/ai.storyteller.coralcraft.desktop
      - install -Dm644 share/mime/packages/ai.storyteller.coralcraft.xml /app/share/mime/packages/ai.storyteller.coralcraft.xml
      - install -Dm644 share/metainfo/ai.storyteller.coralcraft.metainfo.xml /app/share/metainfo/ai.storyteller.coralcraft.metainfo.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/coralcraft /app/share/doc/
    sources:
      - type: dir
        path: stage
