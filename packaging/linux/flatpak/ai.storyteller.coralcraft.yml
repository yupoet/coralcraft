# Flatpak manifest for CoralCraft, ready for Flathub submission.
id: ai.storyteller.coralcraft
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: coralcraft
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --filesystem=xdg-pictures
  - --filesystem=~/.fonts:ro
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: coralcraft
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/coralcraft/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --locked -p coralcraft -p coralcraft-cli
      - install -Dm755 target/release/coralcraft /app/bin/coralcraft
      - install -Dm755 target/release/coralcraft-cli /app/bin/coralcraft-cli
      - install -Dm644 packaging/linux/ai.storyteller.coralcraft.desktop /app/share/applications/ai.storyteller.coralcraft.desktop
      - install -Dm644 packaging/linux/ai.storyteller.coralcraft.mime.xml /app/share/mime/packages/ai.storyteller.coralcraft.xml
      - python3 packaging/icons.py /tmp/flatpak-icons && mkdir -p /app/share/icons && cp -R /tmp/flatpak-icons/hicolor /app/share/icons/
      - >-
        version=$(awk '/^\[/{p=($0=="[workspace.package]");next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml);
        install -d /app/share/metainfo;
        sed -e "s/@VERSION@/$version/" -e "s/@DATE@/$(date -u +%Y-%m-%d)/"
        packaging/linux/ai.storyteller.coralcraft.metainfo.xml.in > /app/share/metainfo/ai.storyteller.coralcraft.metainfo.xml
    sources:
      - type: dir
        path: ../../..
        skip:
          - target
          - dist
          - refs
          - build-flatpak
          - .flatpak-builder
      - cargo-sources.json
