# Flatpak manifest for CoralCraft, ready for a Flathub submission.
#
# Flatpak builds run offline, so the crate sources must be vendored first. From the repo root:
#
#   curl -fsSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
#   python3 flatpak-cargo-generator.py Cargo.lock -o packaging/linux/flatpak/cargo-sources.json
#   flatpak-builder --user --install --force-clean build-flatpak packaging/linux/flatpak/io.github.yupoet.coralcraft.yml
#   flatpak run io.github.yupoet.coralcraft
#
# For Flathub, replace the `dir` source with a `git` source pinned to a release tag and commit.
# Release bundles (.flatpak on GitHub Releases) use io.github.yupoet.coralcraft.bundle.yml instead.
id: io.github.yupoet.coralcraft
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: coralcraft
finish-args:
  - --filesystem=xdg-data/ArtCraft/versions:ro
  # Keep identical to io.github.yupoet.coralcraft.bundle.yml (the release bundle); comments there.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Printing: lpstat/lp (the cups-client module) reach the host's CUPS through its socket and
  # find driverless network printers through Avahi (`lpstat -e`). Without these the Print
  # dialog lists no printers.
  - --socket=cups
  - --system-talk-name=org.freedesktop.Avahi
  # The user's CUPS settings, read-only: their default printer and saved options (lpoptions)
  # and a print server named in their client.conf, which lp reaches over the network.
  - --filesystem=~/.cups:ro
  # Network for the update check against GitHub releases.
  - --share=network
  # Cursor theme: without the cursor-shape protocol (e.g. GNOME 46) winit loads the theme itself.
  # The sandbox sets no XCURSOR_PATH and ships no cursor themes, so the pointer would turn invisible
  # over the window. The host's themes are mounted under /run/host (#2450).
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  # Open/Save dialogs use the file-chooser portal (rfd), and drag-and-drop uses the document
  # portal, so broad filesystem access isn't needed. Pictures is granted for opening files by
  # path from the command line.
  - --filesystem=xdg-pictures
  - --filesystem=~/.fonts:ro
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  # CUPS client tools for craft-print: the runtime has libcups but not lpstat/lp/lpoptions.
  # Linked statically against this release's libcups, so a runtime update can't break them;
  # the socket path matches the host's, which --socket=cups mounts.
  - name: cups-client
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/app --sysconfdir=/etc --localstatedir=/var --with-rundir=/run/cups
        --with-domainsocket=/run/cups/cups.sock --disable-shared --with-components=libcups
        --with-dnssd=avahi --with-tls=gnutls --disable-pam --disable-dbus
      - make -C cups libs
      - make -C systemv lp lpoptions lpstat
      - install -Dm755 -t /app/libexec/cups systemv/lp systemv/lpoptions systemv/lpstat
      - for tool in lp lpoptions lpstat; do install -Dm755 cups-socket.sh "/app/bin/$tool"; done
      - install -Dm644 -t /app/share/licenses/cups LICENSE NOTICE
    sources:
      - type: archive
        url: https://github.com/OpenPrinting/cups/releases/download/v2.4.20/cups-2.4.20-source.tar.gz
        sha256: ab4d9cd7f3e58060091d2b24972223d6401675f11c49b65abf4f6ef31dea22ff
      # Runs each tool. Flatpak mounts the host's CUPS socket at /var/run/cups/cups.sock, choosing
      # it as flatpak-run-cups.c does from the host's CUPS_SERVER, else the first line spelled
      # exactly `ServerName /path` in ~/.cups/client.conf, else the default; it mounts nothing
      # when that socket is missing. CUPS reads the keyword in any case and takes the last
      # ServerName. When CUPS' socket from client.conf is the one Flatpak chose, it is pointed at
      # the mount; when it isn't, the tool fails rather than reach a different server. A
      # CUPS_SERVER is left alone: one set by `flatpak run --env` may not be what was mounted.
      - type: script
        dest-filename: cups-socket.sh
        commands:
          - 'conf="$HOME/.cups/client.conf"'
          - 'if [ -z "${CUPS_SERVER:-}" ] && [ -r "$conf" ]; then'
          - '  server=$(sed -n ''s/^[[:space:]]*[Ss][Ee][Rr][Vv][Ee][Rr][Nn][Aa][Mm][Ee][[:space:]]\{1,\}\([^[:space:]]*\).*/\1/p'' "$conf" | tail -n 1)'
          - '  case "$server" in'
          - '    /*)'
          - '      mounted=$(sed -n ''s/^[[:space:]]*ServerName \(.*\)$/\1/p'' "$conf" | sed ''s/^[[:space:]]*//'' | grep -m 1 ''^/[^:]*$'')'
          - '      if [ "$mounted" = "$server" ]; then'
          - '        export CUPS_SERVER=/var/run/cups/cups.sock'
          - '      else'
          - '        echo "${0##*/}: ~/.cups/client.conf names the CUPS socket $server, but Flatpak gave this app ${mounted:-a different one}; give each socket one ServerName line, spelled ServerName" >&2'
          - '        exit 1'
          - '      fi'
          - '      ;;'
          - '  esac'
          - 'fi'
          - 'exec "/app/libexec/cups/${0##*/}" "$@"'
  - name: coralcraft
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/coralcraft/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --locked -p coralcraft
      - install -Dm755 target/release/coralcraft /app/bin/coralcraft
      - install -Dm644 NOTICE /app/share/doc/coralcraft/NOTICE
      - install -Dm644 packaging/linux/io.github.yupoet.coralcraft.desktop /app/share/applications/io.github.yupoet.coralcraft.desktop
      - install -Dm644 packaging/linux/io.github.yupoet.coralcraft.mime.xml /app/share/mime/packages/io.github.yupoet.coralcraft.xml
      - mkdir -p /app/share/icons && cp -R assets/app-icon/hicolor /app/share/icons/
      - >-
        version=$(awk '/^\[/{p=($0=="[workspace.package]");next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml);
        install -d /app/share/metainfo;
        sed -e "s/@VERSION@/$version/" -e "s/@DATE@/$(date -u +%Y-%m-%d)/"
        packaging/linux/io.github.yupoet.coralcraft.metainfo.xml.in > /app/share/metainfo/io.github.yupoet.coralcraft.metainfo.xml
    sources:
      - type: dir
        path: ../../..
        skip:
          - target
          - dist
          - corpus
          - build-flatpak
          - .flatpak-builder
      - cargo-sources.json
