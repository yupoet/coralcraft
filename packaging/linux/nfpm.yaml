# .deb and .rpm packages (nfpm: https://nfpm.goreleaser.com). Run by package.sh, which stages
# the file tree, substitutes its path for ${STAGE} (nfpm doesn't expand env vars in `src`) and
# exports VERSION and NFPM_ARCH.
#
#   nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/release/
name: coralcraft
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
version_schema: semver
release: 1
section: graphics
priority: optional
maintainer: ${CORALCRAFT_MAINTAINER}
vendor: CoralCraft Contributors
homepage: https://github.com/yupoet/coralcraft
license: MIT OR Apache-2.0
description: |-
  Clean-room, open-source vector illustration and multi-page layout app.
  Pen, shape, boolean, effect, and typography tools; opens and exports .coralcraft,
  .cdr, .cmx, SVG 1.1, PDF 1.4, EPSF-3.0, and DXF.
  Includes coralcraft-cli, a headless converter and 244-tool MCP server.

overrides:
  deb:
    depends:
      - libc6 (>= 2.17)
      - libgcc-s1
    recommends:
      - libxkbcommon0
      - libwayland-client0
      - libx11-6
      - libxcursor1
      - libxi6
      - libxrandr2
      - libgl1 | libegl1
      - xdg-desktop-portal
  rpm:
    depends:
      - libc.so.6()(64bit)
      - libgcc_s.so.1()(64bit)
    recommends:
      - libwayland-client
      - libX11
      - libXcursor
      - libXi
      - libXrandr
      - xdg-desktop-portal

contents:
  - src: ${STAGE}/usr/bin/coralcraft
    dst: /usr/bin/coralcraft
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/bin/coralcraft-cli
    dst: /usr/bin/coralcraft-cli
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/share/
    dst: /usr/share/
    type: tree

scripts:
  postinstall: packaging/linux/postinst.sh
  postremove: packaging/linux/postinst.sh
